[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vicky-sales-agent"
version = "0.1.0"
description = "Autonomous outbound sales agent for Unicorn Club data/AI team augmentation"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "PyYAML>=6.0",
    "anthropic>=1.0",
]

[project.scripts]
vicky = "agent.cli:main"

[tool.setuptools]
packages = ["agent"]
